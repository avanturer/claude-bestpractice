name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The repo layer binds everyone, including a session running without the plugin.
# That is the point of running the same gates here that run locally.
jobs:
  check:
    # OFF by default, because Actions minutes are a real budget and the same gates run
    # locally on every push through the pre-push hook `claude-bp-ci local` installs.
    # Turn it on with:  gh variable set CLAUDE_BESTPRACTICE_CI --body on
    # or Settings -> Secrets and variables -> Actions -> Variables.
    if: vars.CLAUDE_BESTPRACTICE_CI == 'on'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor. Testing only the newest version is how a floor
        # quietly stops being true.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The substrate is defined in terms of git's own behaviour — the common
          # directory, worktree registration, blob hashes. A shallow clone changes
          # those answers, so the tests would be exercising a different git.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Identify git
        run: |
          git config --global user.email "ci@claude-bestpractice"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      # The plugin has no dependencies, and `tools/check_stdlib_only.py` enforces that over
      # `plugin/` on every run. Its TEST SUITE is a different thing and this step used to
      # blur the two: three tests build a throwaway Python project and require the gate to
      # actually drive `python3 -m pytest` over it. A runner with no pytest cannot witness
      # anything, so the gate correctly declines and those three fail.
      #
      # Latent until the release workflow became the first thing to run `make check` on a
      # clean runner — this job is gated behind a variable and had never executed.
      - name: A test runner for the gate to drive
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install --quiet --disable-pip-version-check pytest
          echo "pytest is a test-environment dependency; the plugin itself imports only the stdlib"

      - name: Lint
        run: make lint

      - name: Documentation gate
        run: make docs

      - name: Slop gate
        run: make slop

      - name: Polyglot gate
        run: make polyglot

      - name: Knowledge layer
        run: make knowledge

      - name: Tests
        run: make test

      - name: Doctor
        run: make doctor

      - name: Budget
        run: make budget
